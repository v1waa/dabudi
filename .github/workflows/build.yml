name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  windows:
    name: Windows x64 build and verification
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: Build, test, publish and run WPF
        shell: pwsh
        run: ./scripts/build.ps1
      - name: Upload dependency locks
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dabudi-dependency-locks
          path: |
            src/**/packages.lock.json
            tests/**/packages.lock.json
          if-no-files-found: warn
          retention-days: 7
      - name: Upload EXE and verification output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dabudi-win-x64
          path: |
            dist/dabudi.exe
            dist/dabudi.exe.sha256
            artifacts/smoke/
          if-no-files-found: warn
          retention-days: 14
