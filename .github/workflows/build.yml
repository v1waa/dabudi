name: Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  NUGET_PACKAGES: ${{ github.workspace }}\.nuget\packages

jobs:
  build:
    name: Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
          dotnet-quality: ga
          cache: true
          cache-dependency-path: Source/dabudi/packages.lock.json

      - name: Restore locked dependencies
        run: dotnet restore .\Source\dabudi\dabudi.csproj --locked-mode

      - name: Build
        run: dotnet build .\Source\dabudi\dabudi.csproj --configuration Release --no-restore

      - name: Publish single-file EXE
        run: dotnet publish .\Source\dabudi\dabudi.csproj --configuration Release --no-restore --output .\dist

      - name: Verify output
        shell: pwsh
        run: |
          if (-not (Test-Path .\dist\dabudi.exe)) {
            throw "dist\\dabudi.exe was not created"
          }
          Get-Item .\dist\dabudi.exe | Format-List Name, Length

      - name: Upload executable
        uses: actions/upload-artifact@v7
        with:
          name: dabudi-win-x64
          path: dist/dabudi.exe
          if-no-files-found: error
          retention-days: 14
