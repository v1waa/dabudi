name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release, for example v2.5.8
        required: true
        type: string

permissions:
  contents: write

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  NUGET_PACKAGES: ${{ github.workspace }}\.nuget\packages

jobs:
  release:
    name: Build and release Windows x64
    runs-on: windows-latest

    steps:
      - name: Resolve tag
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            "tag=${{ inputs.tag }}" >> $env:GITHUB_OUTPUT
          } else {
            "tag=${{ github.ref_name }}" >> $env:GITHUB_OUTPUT
          }

      - name: Checkout tag
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.version.outputs.tag }}

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
          dotnet-quality: ga
          cache: true
          cache-dependency-path: Source/dabudi/packages.lock.json

      - name: Restore locked dependencies
        run: dotnet restore .\Source\dabudi\dabudi.csproj --locked-mode

      - name: Publish single-file EXE
        run: dotnet publish .\Source\dabudi\dabudi.csproj --configuration Release --no-restore --output .\dist

      - name: Prepare release asset
        id: asset
        shell: pwsh
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          $asset = "dabudi-$tag-win-x64.exe"
          Copy-Item .\dist\dabudi.exe ".\$asset"
          "path=$asset" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" "${{ steps.asset.outputs.path }}" `
            --repo "${{ github.repository }}" `
            --title "dabudi ${{ steps.version.outputs.tag }}" `
            --generate-notes `
            --verify-tag
