name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['.github/release.json']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dabudi-release
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  release:
    name: Verify and publish Windows x64
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: Locked build, regression checks, publish and WPF smoke test
        shell: pwsh
        run: ./scripts/build.ps1
      - name: Publish verified EXE and checksum
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/release.ps1
      - name: Upload verification output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dabudi-release-verification
          path: artifacts/smoke/
          if-no-files-found: warn
          retention-days: 14
